<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a0d" />
    <meta name="description" content="Xal's Path — a story-driven clicker remake for the web" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Xal's Path</title>
    <script>
      const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)
      if (!local) {
        window.dataLayer = window.dataLayer || []
        function gtag() {
          dataLayer.push(arguments)
        }
        const s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-7Z01JPEF60'
        document.head.appendChild(s)
        gtag('js', new Date())
        gtag('config', 'G-7Z01JPEF60')
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: #0d1a0d;
      }
      body {
        font-family: 'Press Start 2P', 'Courier New', monospace;
      }
      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1a0d;
      }
      /* Phones fill the portrait viewport. Tablet+ (and landscape) stay 390×844. */
      @media (min-width: 768px), (orientation: landscape) {
        #game {
          width: min(390px, 100vw, calc(100dvh * 390 / 844));
          height: min(844px, 100dvh);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
